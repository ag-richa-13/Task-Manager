services:
  - type: web
    runtime: node
    name: taskflow-api
    rootDir: server
    buildCommand: npm install && npm run build
    preDeployCommand: npm run prisma:deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: FRONTEND_URL
        sync: false

  - type: web
    runtime: static
    name: taskflow-web
    rootDir: client
    buildCommand: npm install && VITE_API_URL="https://${API_HOST}.onrender.com" npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          name: taskflow-api
          type: web
          property: host

databases:
  - name: taskflow-db
    plan: free